name: Build AEGIS Binaries

on:
  push:
    branches: [main]
    paths:
      - 'aegis-go/**'
      - '.github/workflows/aegis-build.yml'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            output: aegis-linux-amd64
          - os: windows-latest
            goos: windows
            goarch: amd64
            output: aegis-windows-amd64.exe
          - os: macos-latest
            goos: darwin
            goarch: amd64
            output: aegis-darwin-amd64
          - os: macos-latest
            goos: darwin
            goarch: arm64
            output: aegis-darwin-arm64
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            output: aegis-linux-arm64
          - os: ubuntu-latest
            goos: android
            goarch: arm64
            output: aegis-android-arm64
    runs-on: ${{ matrix.os }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      
      - name: Build AEGIS (Unix)
        if: matrix.os != 'windows-latest'
        working-directory: aegis-go
        run: |
          go mod tidy
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 go build -o ${{ matrix.output }} .
      
      - name: Build AEGIS (Windows)
        if: matrix.os == 'windows-latest'
        working-directory: aegis-go
        shell: pwsh
        run: |
          go mod tidy
          $env:GOOS="${{ matrix.goos }}"
          $env:GOARCH="${{ matrix.goarch }}"
          $env:CGO_ENABLED="0"
          go build -o ${{ matrix.output }} .
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: aegis-go/${{ matrix.output }}
          retention-days: 30
  
  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      
      - name: Create release archive
        run: |
          cd artifacts
          tar -czf aegis-binaries.tar.gz */
          ls -la aegis-binaries.tar.gz
      
      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: aegis-release-archive
          path: artifacts/aegis-binaries.tar.gz
          retention-days: 90
